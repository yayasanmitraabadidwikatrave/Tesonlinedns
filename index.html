<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Portal Status Tes</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;display:flex;align-items:center;justify-content:center;
font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e8f8ed,#c9efd5);color:#173b27}
.card{width:min(100%,520px);background:#fff;border-radius:24px;padding:32px 24px;text-align:center;
box-shadow:0 14px 40px rgba(20,90,45,.15)}
.logo{width:66px;height:66px;border-radius:50%;margin:0 auto 16px;background:#168b43;color:white;
display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:bold}
h1{font-size:clamp(27px,7vw,38px);color:#126b35;margin:0 0 12px}
.subtitle{font-size:16px;line-height:1.5;color:#526b5a;margin:0 0 25px}
label{display:block;text-align:left;font-weight:bold;margin-bottom:9px}
input{width:100%;padding:16px;border:2px solid #c9dfd0;border-radius:12px;font-size:17px}
input:focus{outline:2px solid #168b43;border-color:#168b43}
button{width:100%;margin-top:16px;padding:17px;border:0;border-radius:12px;background:#168b43;
color:white;font-size:18px;font-weight:bold;cursor:pointer}
button:hover{background:#0f7336}
#error{display:none;color:#b42318;font-size:14px;line-height:1.5;margin:14px 0 0}
#result{display:none}
.check{width:140px;height:140px;border-radius:50%;margin:4px auto 22px;background:#18a64b;color:white;
display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:bold;
box-shadow:0 8px 22px rgba(24,166,75,.25)}
.success{font-size:clamp(30px,7vw,40px);font-weight:900;line-height:1.2;color:#12813a;margin:0}
.name{font-size:19px;color:#345b42;margin:14px 0 0;overflow-wrap:anywhere}
.disclaimer{font-size:12px;color:#687b6e;line-height:1.5;margin-top:22px}
.back{background:#e8f4ec;color:#176b37}
.back:hover{background:#d9eddf}
</style>
</head>
<body>
<main class="card">
  <section id="login">
    <div class="logo">✓</div>
    <h1>LOGIN PORTAL TES</h1>
    <p class="subtitle">Silakan masukkan nama lengkap Anda untuk masuk dan melihat status tes.</p>
    <form id="loginForm">
      <label for="nama">Nama lengkap</label>
      <input id="nama" type="text" placeholder="Masukkan nama lengkap" autocomplete="name" required>
      <button type="submit">LOGIN / CEK STATUS</button>
    </form>
    <p id="error" role="alert">Nama tidak terdaftar atau penulisannya tidak sesuai. Silakan periksa kembali.</p>
  </section>

  <section id="result" aria-live="polite">
    <div class="check" aria-label="Tanda centang hijau">✓</div>
    <p class="success">SELAMAT<br>ANDA LULUS TES</p>
    <p class="name" id="namaHasil"></p>
    <p class="disclaimer">SIMULASI / DEMO — hasil ini bukan pengumuman atau verifikasi kelulusan resmi dari penyelenggara tes.</p>
    <button class="back" id="kembali" type="button">KEMBALI</button>
  </section>
</main>
<script>
const namaTerdaftar = "mayang adi julia saputri";
const login = document.getElementById("login");
const result = document.getElementById("result");
const inputNama = document.getElementById("nama");
const error = document.getElementById("error");

document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const nama = inputNama.value.trim();
  if (nama.toLocaleLowerCase("id-ID") !== namaTerdaftar) {
    error.style.display = "block";
    result.style.display = "none";
    return;
  }
  error.style.display = "none";
  document.getElementById("namaHasil").textContent = nama;
  login.style.display = "none";
  result.style.display = "block";
});

document.getElementById("kembali").addEventListener("click", function() {
  result.style.display = "none";
  login.style.display = "block";
  inputNama.value = "";
  inputNama.focus();
});
</script>
</body>
</html>
